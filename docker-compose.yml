version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: teamtasks-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
    volumes:
      - sqlvolume:/var/opt/mssql

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: teamtasks-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./DBSetup_TeamTasks.sql:/tmp/init-script.sql
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "YourStrong@Passw0rd", "-C", "-i", "/tmp/init-script.sql"]

  teamtasks-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamtasks-api
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TeamTasksSample;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      db-init:
        condition: service_completed_successfully

  teamtasks-web:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: teamtasks-web
    ports:
      - "4200:80"
    depends_on:
      - teamtasks-api

volumes:
  sqlvolume:
